<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Member Status</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:"Helvetica Neue",sans-serif;
  min-height:100vh;
  color:white;
  overflow-x:hidden;

  background:
  radial-gradient(circle at top left, rgba(120,170,255,0.12), transparent 25%),
  radial-gradient(circle at top right, rgba(255,255,255,0.06), transparent 20%),
  radial-gradient(circle at bottom right, rgba(120,170,255,0.10), transparent 25%),
  linear-gradient(135deg,#05070d,#0f1726,#05070d);

  padding:20px;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background-image:
    radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,0.7), transparent),
    radial-gradient(2px 2px at 70% 20%, rgba(255,215,0,0.7), transparent),
    radial-gradient(2px 2px at 80% 80%, rgba(255,255,255,0.7), transparent),
    radial-gradient(2px 2px at 30% 70%, rgba(255,215,0,0.7), transparent);
  animation:sparkle 6s linear infinite;
  pointer-events:none;
}

@keyframes sparkle{
  from{ transform:translateY(0); }
  to{ transform:translateY(-20px); }
}

.container{
  max-width:900px;
  margin:auto;
}

.main-card{
  position:relative;
  border-radius:35px;
  padding:40px;
  overflow:hidden;
  background:linear-gradient(135deg,rgba(255,215,0,0.18),rgba(255,255,255,0.04));
  border:1px solid rgba(255,255,255,0.15);
  backdrop-filter:blur(20px);
  box-shadow:
    0 0 50px rgba(255,215,0,0.15),
    0 0 100px rgba(0,0,0,0.4);
  animation:fadeUp 1s ease;
}

.main-card::before{
  content:"";
  position:absolute;
  width:300px;
  height:300px;
  background:radial-gradient(circle,rgba(255,215,0,0.25),transparent 70%);
  top:-100px;
  right:-100px;
}

.member-label{
  font-size:18px;
  opacity:0.8;
  letter-spacing:3px;
  margin-bottom:20px;
}

.name{
  font-size:64px;
  font-weight:700;
  margin-bottom:10px;
}

.point-label{
  margin-top:40px;
  font-size:20px;
  opacity:0.7;
}

.point{
  font-size:110px;
  font-weight:bold;
  line-height:1;
  margin-top:10px;
}

.point span{
  font-size:45px;
}

.rank-circle{
  position:absolute;
  right:40px;
  top:60px;
  width:260px;
  height:260px;
  border-radius:50%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  border:4px solid rgba(255,255,255,0.15);
  box-shadow:
    0 0 30px rgba(255,215,0,0.25),
    inset 0 0 30px rgba(255,255,255,0.05);
  backdrop-filter:blur(10px);
}

.rank-type{
  font-size:22px;
  letter-spacing:3px;
  margin-bottom:10px;
}

.rank-name{
  font-size:48px;
  font-weight:bold;
}

.rank-position{
  margin-top:15px;
  font-size:24px;
  opacity:0.9;
}

.diamond{
  color:#b9f2ff;
  box-shadow:
    0 0 35px rgba(185,242,255,0.8),
    inset 0 0 35px rgba(185,242,255,0.25);
}

.platinum{

  color:#f8fafc;

  text-shadow:
    0 0 8px rgba(255,255,255,0.9),
    0 0 18px rgba(220,220,220,0.9),
    0 0 30px rgba(255,255,255,0.6);

  box-shadow:
    0 0 40px rgba(255,255,255,0.45),
    0 0 80px rgba(200,200,200,0.25),
    inset 0 0 40px rgba(255,255,255,0.18);

  background:
    radial-gradient(
      circle at top,
      rgba(255,255,255,0.12),
      transparent 70%
    );

  border-color:
    rgba(255,255,255,0.35);
}

.gold{
  color:#f6d36d;
}

.silver{
  color:#d8d8d8;
}

.regular{
  color:#79bfff;
}

body.rank-diamond{
  background:
    radial-gradient(circle at top left, rgba(185,242,255,0.35), transparent 28%),
    radial-gradient(circle at top right, rgba(255,255,255,0.22), transparent 22%),
    radial-gradient(circle at bottom right, rgba(255,215,0,0.25), transparent 28%),
    linear-gradient(135deg,#020617,#0f172a,#111827);
}

body.rank-diamond .main-card{
  background:linear-gradient(135deg,rgba(185,242,255,0.25),rgba(255,215,0,0.13),rgba(255,255,255,0.06));
  border:1px solid rgba(185,242,255,0.45);
  box-shadow:
    0 0 60px rgba(185,242,255,0.35),
    0 0 120px rgba(255,215,0,0.18),
    0 0 120px rgba(0,0,0,0.45);
}
body.rank-diamond::after{

  content:"✦";

  position:fixed;

  inset:0;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:420px;

  color:rgba(185,242,255,0.05);

  pointer-events:none;

  transform:rotate(-12deg);

  letter-spacing:40px;
}

body.rank-diamond .main-card::after{

  content:"♔";

  position:absolute;

  bottom:-30px;

  left:-10px;

  font-size:180px;

  color:rgba(255,255,255,0.04);

  transform:rotate(-10deg);
}

body.rank-diamond .main-card::before{
  background:radial-gradient(circle,rgba(185,242,255,0.45),transparent 70%);
}

.other-section{
  margin-top:35px;
}

.other-title{
  margin-bottom:20px;
  font-size:22px;
  opacity:0.9;
}

.member-list{
  display:flex;
  gap:15px;
  overflow-x:auto;
  padding-bottom:10px;
}

.member-list::-webkit-scrollbar{
  height:8px;
}

.member-list::-webkit-scrollbar-thumb{
  background:#555;
  border-radius:10px;
}

.member-card{
  min-width:150px;
  background:linear-gradient(180deg,rgba(255,255,255,0.06),rgba(255,255,255,0.02));
  border-radius:25px;
  padding:20px;
  text-align:center;
  border:1px solid rgba(255,255,255,0.08);
  transition:0.3s;
}

.member-card:hover{
  transform:translateY(-5px);
}

.member-rank{
  font-size:18px;
  margin-bottom:15px;
  opacity:0.8;
}

.member-name{
  font-size:24px;
  margin-bottom:15px;
  font-weight:bold;
}

.member-point{
  font-size:32px;
  font-weight:bold;
}

.member-point span{
  font-size:18px;
}

.history-section{
  margin-top:40px;
  background:rgba(255,255,255,0.04);
  border-radius:30px;
  padding:25px;
  border:1px solid rgba(255,255,255,0.08);
}

.history-item{
  display:flex;
  justify-content:space-between;
  padding:15px 0;
  border-bottom:1px solid rgba(255,255,255,0.08);
}

.history-item:last-child{
  border-bottom:none;
}

.history-text{
  opacity:0.9;
}

.history-point{
  font-weight:bold;
}

.plus{
  color:#6ebcff;
}

.minus{
  color:#ff7b7b;
}

.zero{
  color:#5bff9d;
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(30px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@media(max-width:768px){
  .main-card{
    padding:30px;
  }

  .rank-circle{
    position:relative;
    margin:auto;
    top:auto;
    right:auto;
    margin-top:40px;
    width:220px;
    height:220px;
  }

  .name{
    font-size:48px;
  }

  .point{
    font-size:72px;
  }

  .rank-name{
    font-size:40px;
  }
}

</style>
</head>

<body>

<div class="container">

  <div class="main-card">

    <div class="member-label">MEMBER STATUS</div>

    <div class="name" id="name">読み込み中...</div>

    <div class="point-label">CURRENT POINT</div>

    <div class="point" id="point">0<span>pt</span></div>

    <div class="rank-circle" id="rankCircle">
      <div class="rank-type">STATUS</div>
      <div class="rank-name" id="rankName">REGULAR</div>
      <div class="rank-position" id="rankPosition">-位</div>
    </div>

  </div>

  <div class="other-section">
    <div class="other-title">他のメンバーのポイント</div>
    <div class="member-list" id="memberList"></div>
  </div>

  <div class="history-section">
    <div class="other-title">POINT HISTORY</div>
    <div id="historyList"></div>
  </div>

</div>

<script>

const sheetID = "1LNRt--CsEMVtk7VQUjSAolO4bLh6881EKz9dPxHNZWo";
const sheetName = "シート1";
const historySheet = "履歴";

const url = `https://opensheet.elk.sh/${sheetID}/${sheetName}`;
const historyUrl = `https://opensheet.elk.sh/${sheetID}/${historySheet}`;

function cleanNumber(value){
  return Number(String(value).replace(/,/g,"").trim());
}

function animatePoint(target){
  if(isNaN(target)){
    target = 0;
  }

  let current = 0;
  const pointElement = document.getElementById("point");
  const increment = Math.max(1, Math.ceil(target / 80));

  const timer = setInterval(()=>{
    current += increment;

    if(current >= target){
      current = target;
      clearInterval(timer);
    }

    pointElement.innerHTML = `${current}<span>pt</span>`;
  },20);
}

function setRank(rank){
  const rankCircle = document.getElementById("rankCircle");
  const rankName = document.getElementById("rankName");

  rankCircle.classList.remove("diamond","platinum","gold","silver","regular");
  document.body.classList.remove("rank-diamond");

  if(rank === 1){
    rankCircle.classList.add("diamond");
    rankName.textContent = "DIAMOND";
    document.body.classList.add("rank-diamond");
  }else if(rank === 2){
    rankCircle.classList.add("platinum");
    rankName.textContent = "PLATINUM";
  }else if(rank === 3){
    rankCircle.classList.add("gold");
    rankName.textContent = "GOLD";
  }else if(rank === 4){
    rankCircle.classList.add("silver");
    rankName.textContent = "SILVER";
  }else{
    rankCircle.classList.add("regular");
    rankName.textContent = "REGULAR";
  }
}

function getHistoryClass(pointText){
  const text = String(pointText).trim();

  if(text.includes("+")){
    return "plus";
  }

  if(text.includes("-")){
    return "minus";
  }

  return "zero";
}

async function loadData(){
  const response = await fetch(url);
  const data = await response.json();

  data.sort((a,b)=> cleanNumber(b.ポイント) - cleanNumber(a.ポイント));

  const params = new URLSearchParams(window.location.search);
  const userID = params.get("id");

  const user = data.find(row => row.ID === userID);

  if(user){
    document.getElementById("name").textContent = `${user.名前} 様`;
    animatePoint(cleanNumber(user.ポイント));

    const rank = data.findIndex(row => row.ID === userID) + 1;

    document.getElementById("rankPosition").textContent = `${rank}位`;
    setRank(rank);
  }else{
    document.getElementById("name").textContent = "ユーザーが見つかりません";
    document.getElementById("point").innerHTML = `0<span>pt</span>`;
    document.getElementById("rankPosition").textContent = "-位";
    setRank(999);
  }

  const memberList = document.getElementById("memberList");
  memberList.innerHTML = "";

  data.forEach((player,index)=>{
    memberList.innerHTML += `
      <div class="member-card">
        <div class="member-rank">${index + 1}位</div>
        <div class="member-name">${player.名前}</div>
        <div class="member-point">${player.ポイント}<span>pt</span></div>
      </div>
    `;
  });

  try{
    const historyResponse = await fetch(historyUrl);
    const historyData = await historyResponse.json();

    const historyList = document.getElementById("historyList");
    historyList.innerHTML = "";

    const userHistory = historyData.filter(item => item.ID === userID);

    if(userHistory.length === 0){
      historyList.innerHTML = `<div class="history-item"><div class="history-text">履歴はまだありません</div><div class="history-point zero">0</div></div>`;
      return;
    }

    userHistory.forEach(item=>{
      const pointClass = getHistoryClass(item.ポイント);

      historyList.innerHTML += `
        <div class="history-item">
          <div class="history-text">${item.内容}</div>
          <div class="history-point ${pointClass}">${item.ポイント}</div>
        </div>
      `;
    });
  }catch(error){
    document.getElementById("historyList").innerHTML = `
      <div class="history-item">
        <div class="history-text">履歴を読み込めませんでした</div>
        <div class="history-point zero">0</div>
      </div>
    `;
  }
}

loadData();

</script>

</body>
</html>
